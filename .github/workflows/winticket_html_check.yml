name: WINTICKET HTML Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch sample WINTICKET HTML
        run: python program/line_program_VER2/001

      - name: Upload fetched HTML
        uses: actions/upload-artifact@v4
        with:
          name: winticket-test-lines-${{ github.run_number }}
          path: data_official/today/winticket_test_lines.html
          if-no-files-found: error
          retention-days: 3
