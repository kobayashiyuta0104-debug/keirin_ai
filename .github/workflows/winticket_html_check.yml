name: WINTICKET Lines Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Collect today's WINTICKET HTML
        run: python official_program/019_collect_today_lines_html.py

      - name: Build today's line JSON
        run: python official_program/020_build_today_lines.py

      - name: Upload fetched HTML
        uses: actions/upload-artifact@v4
        with:
          name: winticket-today-lines-${{ github.run_number }}
          path: |
            data_official/today/today_lines.html
            data_official/today/today_lines.json
          if-no-files-found: error
          retention-days: 3
