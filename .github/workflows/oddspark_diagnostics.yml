name: OddsPark Calendar Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.17"

      - name: Install matching requests version
        run: python -m pip install requests==2.34.2

      - name: Probe daily calendar request
        continue-on-error: true
        env:
          ODDSPARK_CALENDAR_DIAGNOSTIC_ONLY: "1"
        run: python official_program/011_collect_daily_oddspark_html.py

      - name: Probe today calendar request
        continue-on-error: true
        env:
          ODDSPARK_CALENDAR_DIAGNOSTIC_ONLY: "1"
        run: python official_program/019_collect_today_lines_html.py
